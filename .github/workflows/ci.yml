name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Select offline build configuration from current source markers
        run: node scripts/backend/build-source-env.mjs

      - name: Type check
        run: npm run check

      - name: Content validation
        run: npm run validate:content

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: |
          node --import tsx scripts/validate-public-backend.ts
          npm run build

      - name: Smoke tests
        run: npm run test:smoke

      - name: Artifact verification
        run: npm run verify:build

      - name: Link check
        run: npm run check:links

      - name: Accessibility check
        run: npm run test:a11y

      - name: Lighthouse budgets
        run: npm run check:lighthouse

      - name: Enabled backend build and artifact gates
        env:
          # Public compilation fixture only; never connects or submits content.
          PUBLIC_BACKEND_ENABLED: 'true'
          PUBLIC_SUPABASE_URL: https://fixture.supabase.co
          PUBLIC_API_BASE: https://fixture.supabase.co/functions/v1/api/v1
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_fixture
        run: |
          node --import tsx scripts/validate-public-backend.ts
          npm run build
          npm run test:smoke
          npm run verify:build
          npm run check:links
          npm run test:a11y
          npm run check:lighthouse
