name: Backend foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency advisory gate (all scopes)
        run: npm audit --audit-level=low --fetch-timeout=30000 --fetch-retries=1
      - name: Embedded PostgreSQL, HTTP and client contracts
        run: npm run test:backend
      - name: Deno Edge typecheck
        run: npm run check:edge
      - name: Prepare real-source hosted packet offline
        run: |
          npm run backend:hosted:prepare -- --project-ref eqxlywwvchmzuyqtxexu --source-commit "$(git rev-parse HEAD)" --out backend-test-results/hosted-import-packet-ci.json
          packet_hash_before=$(sha256sum backend-test-results/hosted-import-packet-ci.json)
          if npm run backend:hosted:prepare -- --project-ref eqxlywwvchmzuyqtxexu --source-commit "$(git rev-parse HEAD)" --out backend-test-results/hosted-import-packet-ci.json; then
            exit 1
          fi
          test "$packet_hash_before" = "$(sha256sum backend-test-results/hosted-import-packet-ci.json)"
  local-stack:
    name: Local Supabase and browser pilot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build current Git source and inventory import contexts
        run: npm run build
      - name: Prepare disposable local test providers
        run: node scripts/backend/prepare-ci.mjs
      - name: Start local Supabase (credentials stay out of logs)
        run: |
          npx supabase start --exclude studio,postgres-meta,imgproxy,supavisor > /tmp/hiens-local-start.log 2>&1 || { node scripts/backend/start-errors.mjs; exit 1; }
          npx supabase status -o json > backend-test-results/stack.json
      - name: Bootstrap isolated members/owner and rehearse import
        run: node --import tsx scripts/backend/fixtures.mjs
      - name: Real JWT, direct Data API/RPC, concurrency and refresh checks
        run: npm run test:backend:integration
      - name: Native hosted import packet and atomic rollback rehearsal
        run: node --import tsx tests/backend/hosted-packet-native.mjs
      - name: Install native encryption tool for disposable recovery test
        run: |
          sudo apt-get update -qq > /tmp/hn-age-install.log 2>&1
          sudo apt-get install -y age >> /tmp/hn-age-install.log 2>&1
      - name: Exported snapshot, native recovery and age round trip (local fixtures only)
        run: node --import tsx tests/backend/hosted-recovery-native.mjs
      - name: Native backup/restore and maintenance rollback rehearsal
        run: node --import tsx scripts/backend/restore-rehearsal.mjs
      - name: Select duration for this source change
        id: load-profile
        run: node scripts/backend/load-profile.mjs
      - name: Open-arrival mixed text API load (10/20/50 RPS)
        run: node --import tsx tests/load/local.mjs
        env:
          BACKEND_LOAD_PROFILE: ${{ steps.load-profile.outputs.profile }}
      - name: Compile local API pilot and enforce route budgets/accessibility
        run: |
          export LOCAL_PUBLISHABLE_KEY="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("backend-test-results/sessions.json")).key)')"
          npm run build:pilot
          npm run check:pilot
          npx html-validate ".pilot-dist/**/*.html"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser pilot against real local API
        run: npm run test:browser
      - name: Redacted local operations summary
        run: npm run backend:ops
      - name: Retain numeric release summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-summary
          path: |
            backend-test-results/restore-summary.json
            backend-test-results/load-summary.json
            backend-test-results/ops-summary.json
            backend-test-results/hosted-packet-summary.json
            backend-test-results/hosted-recovery-summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local stack
        if: always()
        run: npx supabase stop --no-backup
