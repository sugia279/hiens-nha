name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Archive guestbook]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; do not cancel a running release
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Quality gates and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Content validation
        run: npm run validate:content

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: |
          node --import tsx scripts/validate-public-backend.ts
          npm run build
        env:
          # Browser-public config only; API activation also requires matching source markers.
          PUBLIC_BACKEND_ENABLED: ${{ vars.PUBLIC_BACKEND_ENABLED || 'false' }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          # Mask even the public key in logs; preflight rejects privileged keys before bundling.
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}

      - name: Smoke tests
        run: npm run test:smoke

      - name: Artifact verification
        run: npm run verify:build

      - name: Link check
        run: npm run check:links

      - name: Accessibility check
        run: npm run test:a11y

      - name: Lighthouse budgets
        run: npm run check:lighthouse

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Approved old-host redirects after root cutover
        if: vars.ROOT_PAGES_REDIRECT == 'true'
        env:
          ROOT_PAGES_REDIRECT: 'true'
        run: |
          node scripts/pages/redirects.mjs
          npm run test:a11y

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
